<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="virusGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#39ff14;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#1a8a0a;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0a3d02;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background glow -->
  <circle cx="100" cy="100" r="90" fill="url(#virusGlow)" opacity="0.3"/>
  
  <!-- Main virus body -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="#39ff14" stroke-width="2" filter="url(#glow)" opacity="0.9"/>
  <circle cx="100" cy="100" r="42" fill="rgba(57,255,20,0.05)" stroke="#39ff14" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Inner details -->
  <circle cx="85" cy="88" r="8" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.7"/>
  <circle cx="115" cy="92" r="6" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.7"/>
  <circle cx="95" cy="112" r="7" fill="none" stroke="#39ff14" stroke-width="1.5" opacity="0.7"/>
  <circle cx="108" cy="80" r="5" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.5"/>
  <circle cx="88" cy="105" r="4" fill="none" stroke="#39ff14" stroke-width="1" opacity="0.5"/>
  
  <!-- Spikes/protrusions -->
  <g filter="url(#outerGlow)" stroke="#39ff14" stroke-width="2" fill="none" opacity="0.9">
    <!-- Top -->
    <line x1="100" y1="55" x2="100" y2="35"/>
    <circle cx="100" cy="32" r="4" fill="#39ff14" opacity="0.8"/>
    
    <!-- Top-right -->
    <line x1="130" y1="65" x2="145" y2="50"/>
    <circle cx="147" cy="48" r="3.5" fill="#39ff14" opacity="0.8"/>
    
    <!-- Right -->
    <line x1="145" y1="100" x2="165" y2="100"/>
    <circle cx="168" cy="100" r="4" fill="#39ff14" opacity="0.8"/>
    
    <!-- Bottom-right -->
    <line x1="130" y1="135" x2="145" y2="150"/>
    <circle cx="147" cy="152" r="3.5" fill="#39ff14" opacity="0.8"/>
    
    <!-- Bottom -->
    <line x1="100" y1="145" x2="100" y2="165"/>
    <circle cx="100" cy="168" r="4" fill="#39ff14" opacity="0.8"/>
    
    <!-- Bottom-left -->
    <line x1="70" y1="135" x2="55" y2="150"/>
    <circle cx="53" cy="152" r="3.5" fill="#39ff14" opacity="0.8"/>
    
    <!-- Left -->
    <line x1="55" y1="100" x2="35" y2="100"/>
    <circle cx="32" cy="100" r="4" fill="#39ff14" opacity="0.8"/>
    
    <!-- Top-left -->
    <line x1="70" y1="65" x2="55" y2="50"/>
    <circle cx="53" cy="48" r="3.5" fill="#39ff14" opacity="0.8"/>
    
    <!-- Extra spikes -->
    <line x1="115" y1="58" x2="125" y2="42"/>
    <circle cx="126" cy="40" r="3" fill="#39ff14" opacity="0.7"/>
    
    <line x1="142" y1="115" x2="158" y2="120"/>
    <circle cx="160" cy="121" r="3" fill="#39ff14" opacity="0.7"/>
    
    <line x1="85" y1="58" x2="75" y2="42"/>
    <circle cx="74" cy="40" r="3" fill="#39ff14" opacity="0.7"/>
    
    <line x1="58" y1="115" x2="42" y2="120"/>
    <circle cx="40" cy="121" r="3" fill="#39ff14" opacity="0.7"/>
  </g>
  
  <!-- Scanline effect -->
  <g opacity="0.1">
    <line x1="0" y1="20" x2="200" y2="20" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="40" x2="200" y2="40" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="200" y2="60" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="200" y2="80" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="200" y2="120" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="140" x2="200" y2="140" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="200" y2="160" stroke="#39ff14" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="200" y2="180" stroke="#39ff14" stroke-width="0.5"/>
  </g>
</svg>
